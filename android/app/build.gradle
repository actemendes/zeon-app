
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.protobuf" version "0.9.4"
    id "com.squareup.wire" version "5.3.1"
}

wire {
    kotlin {
        android = true
    }
    protoPath {
        srcDir 'src/main/protos'
    }
    sourcePath {
        srcDir 'src/main/protos/'
        include '**'
    }
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def readPubspecAppVersion = {
    def pubspecFile = rootProject.file('../pubspec.yaml')
    if (!pubspecFile.exists()) {
        throw new GradleException("pubspec.yaml not found: ${pubspecFile}")
    }

    def versionLine = pubspecFile.readLines('UTF-8').find { it ==~ /^\s*version:\s*.+$/ }
    if (versionLine == null) {
        throw new GradleException("Could not find 'version:' in ${pubspecFile}")
    }

    def rawVersion = versionLine.split(':', 2)[1].trim()
        .replaceAll(/\s+#.*$/, '')
        .replaceAll(/^["']|["']$/, '')
    def versionParts = rawVersion.split(/\+/, 2)
    def versionName = versionParts[0]
    def semver = versionName =~ /^(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?$/
    if (!semver.matches()) {
        throw new GradleException("Unsupported pubspec version '${rawVersion}'. Expected 'x.y.z' or 'x.y.z+buildNumber'.")
    }

    def versionCode
    if (versionParts.length == 2 && versionParts[1].trim()) {
        if (!(versionParts[1] ==~ /^\d+$/)) {
            throw new GradleException("Android versionCode must be numeric in pubspec version '${rawVersion}'.")
        }
        versionCode = versionParts[1].toInteger()
    } else {
        versionCode = semver[0][1].toInteger() * 10000 + semver[0][2].toInteger() * 100 + semver[0][3].toInteger()
    }

    if (versionCode < 1) {
        throw new GradleException("Android versionCode must be positive in pubspec version '${rawVersion}'.")
    }

    return [name: versionName, code: versionCode]
}

def pubspecAppVersion = readPubspecAppVersion()

boolean hasKeyStore = false

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasKeyStore = true
} else {
    println "+++"
    println "No keystore defined. The app will not be signed."
    println "Create a android/key.properties file with the following properties:"
    println "storePassword"
    println "keyPassword"
    println "keyAlias"
    println "storeFile"
    println "+++"
}

// Keep pubspec.yaml as the source of truth, even when local.properties is stale.
def flutterVersionCode = pubspecAppVersion.code.toString()
def flutterVersionName = pubspecAppVersion.name

android {
    namespace 'com.zeon.zeon'
    testNamespace "test.com.zeon.zeon"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.zeon.hiddify"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        testInstrumentationRunner "test.com.zeon.zeon.bg.VpnTestInstrumentation"
    }

    splits {
        abi {
            enable true
            reset()
            //noinspection ChromeOsAbiSupport
            include "x86_64", "armeabi-v7a", "arm64-v8a"

            universalApk true
        }
    }

    if (hasKeyStore) {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeyStore) {
                signingConfig signingConfigs.release
            }
            debuggable false
            jniDebuggable false
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters "x86_64", "armeabi-v7a", "arm64-v8a"
                debugSymbolLevel 'FULL'
            }
        }
    }

    buildFeatures {
        viewBinding true
        aidl true
    }

}

gradle.taskGraph.whenReady { graph ->
    def buildsReleaseArtifact = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains('release')
    }
    if (buildsReleaseArtifact && !hasKeyStore) {
        throw new GradleException(
            "Refusing to build a release artifact without android/key.properties. " +
            "Production releases must never use the public Android debug signing key."
        )
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        output.versionCodeOverride = android.defaultConfig.versionCode
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "androidx.compose.ui:ui:1.7.8"
    implementation("com.squareup.wire:wire-grpc-client:5.3.1")

    implementation 'io.grpc:grpc-okhttp:1.64.0'
    implementation 'io.grpc:grpc-protobuf-lite:1.64.0'
    implementation 'io.grpc:grpc-stub:1.64.0'
//    protoPath(project(':zeon_api'))
//    implementation project(':zeon_api')




}
