    const island = { o: show ? 1 : 0, pe: show ? 'auto' : 'none', ty: show ? 0 : -24, sc: show ? 1 : 0.9, w: iw, x: (W - iw) / 2, y: round ? 30 : 14,
      text: this.lastIt || '', dot: tone, label: it || 'Уведомление' };

    const homeP = onHome ? { x: 0, o: 1, t: ease } : stage === 'splash' ? { x: 0, o: 0, t: ease } : pos('home');
    const v = { splashO: stage === 'splash' ? 1 : 0, homeO: homeP.o, homePe: onHome ? 'auto' : 'none', homeX: homeP.x, homeT: homeP.t,
      edgeO: drag ? (1 - f).toFixed(3) : 0 };

    // Binding by subscription number, as zeon-app does on Android TV (tv_account_number_dialog.dart):
    // an on-screen 3×4 keypad, no system keyboard; on the watch the sixth digit submits.
    // First run, as in zeon-app intro_page.dart: «Стартуем» creates a profile without registration;
    // «Я уже имею аккаунт» leads to binding by subscription number.
    const pw = pos('intro'), pa = pos('introBind'), pb2 = pos('introCode');
    const starting = !!this.props.starting;
    const intro = { wpt: round ? 132 : 112, wO: pw.o, wPe: pw.pe, wX: pw.x, wT: pw.t, startO: starting ? 0.6 : 1, accPe: starting ? 'none' : 'auto',
      pt: round ? 128 : 96, px: round ? 64 : 34, aO: pa.o, aPe: pa.pe, aX: pa.x, aT: pa.t, bO: pb2.o, bPe: pb2.pe, bX: pb2.x, bT: pb2.t };
    const digits = String(this.props.code ?? '').replace(/[^0-9]/g, '').slice(0, 6);
    const binding = !!this.props.binding;
    const slots = [0, 1, 2, 3, 4, 5].map((i) => ({ d: digits[i] || '', line: binding ? '#3CE74F' : i === digits.length ? '#D8DEE6' : '#1A1B1F' }));
    const padKey = (label, act, kind) => ({ label, act, isDigit: !kind, isClear: kind === 'clear', isDel: kind === 'del', o: binding ? 0.42 : 1 });
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((d) => padKey(d, () => this.nav('digit', d)))
      .concat([padKey('Очистить номер', () => this.nav('clearCode'), 'clear'), padKey('0', () => this.nav('digit', '0')), padKey('Удалить последнюю цифру', () => this.nav('delDigit'), 'del')]);
    const code = { pt: round ? 66 : 70, slots, keys, label: digits || 'пусто' };

    const paging = this.state.paging;
    const pager = { y: -this.state.pg * H + (this.state.vy || 0), t: paging ? 'none' : 'transform .45s cubic-bezier(.2,.8,.2,1)' };

    return { W, H, R, S, gl, z, pager, pillBg, srv, island, v, menuItems, menuPad, panes, listPad,
      pill: { y: H - (round ? 92 : 72) },
      wm: stage === 'intro' || stage === 'introBind' ? { w: 170, h: 45, x: (W - 170) / 2, y: round ? 64 : 34, o: 1 } : { w: 300, h: 79, x: (W - 300) / 2, y: (H - 79) / 2, o: stage === 'splash' ? 1 : 0 },
      intro, code, introNext: () => this.nav('open', 'introCode'),
      startNow: () => { if (!starting) this.nav('start'); }, haveAccount: () => this.nav('open', 'introBind'),
      dots: { x: W - (round ? 22 : 14), y: H / 2 - 12, a: this.state.pg === 0 ? '#F2F4F6' : '#4A4F57', b: this.state.pg === 1 ? '#F2F4F6' : '#4A4F57' },
      diskLabel: conn === 'on' ? 'Отключить ZEON' : conn === 'connecting' ? 'Отменить подключение' : 'Подключить ZEON',
      setMenu: this.setMenu, onMenuScroll: this.onMenuScroll,
      tapDisk: this.tapDisk, pressDisk: this.pressDisk, releaseDisk: this.releaseDisk, noMenu: this.noMenu,
      openServers: () => this.nav('open', 'servers'), tapIsland: () => this.nav('island'),
      g: { down: this.gDown, move: this.gMove, up: this.gUp, cancel: this.gCancel, click: this.gClick, wheel: this.gWheel } };
  }
}
</script>
</body>
