<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ZEON VPN · карточка списка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}@keyframes zv-pulse{0%,100%{opacity:.35}50%{opacity:1}}.zv-pulse{animation:zv-pulse 1.4s ease-in-out infinite}</style>
</helmet>
<div style="width: {{it.w}}px; height: {{it.h}}px; display: flex; flex-direction: column; justify-content: center; font-family: 'Montserrat', sans-serif; color: #F2F4F6; opacity: {{it.op}}; pointer-events: {{it.pe}}">

<sc-if value="{{it.isTitle}}" hint-placeholder-val="{{ false }}"><div style="text-align: center; font-size: 26px; font-weight: 700; color: #F2F4F6">{{it.text}}</div></sc-if>

<sc-if value="{{it.isGroup}}" hint-placeholder-val="{{ false }}"><div style="padding: 10px 28px 0; font-size: 17px; font-weight: 700; color: #8B939C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.text}}</div></sc-if>

<sc-if value="{{it.isProfile}}" hint-placeholder-val="{{ false }}"><div style="border-radius: 34px; background: #1A1B1F; box-sizing: border-box; padding: 18px 26px 20px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 24px; font-weight: 700; color: #F2F4F6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.text}}</div>
<div style="display: flex; align-items: baseline; gap: 8px; white-space: nowrap"><span style="font-size: 21px; font-weight: 700; color: {{it.c}}">{{it.days}}</span><span style="font-size: 17px; font-weight: 600; color: #B1B8C2">{{it.meta}}</span></div>
<div style="height: 8px; border-radius: 4px; background: #2A2D33; margin-top: 6px; overflow: hidden"><div style="height: 8px; border-radius: 4px; width: {{it.bar}}; background: {{it.c}}"></div></div>
</div></sc-if>

<sc-if value="{{it.isAction}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{it.act}}" style="height: 72px; border-radius: 36px; border: 2px solid {{it.line}}; background: {{it.bg}}; color: {{it.fg}}; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: 'Montserrat', sans-serif; font-size: 23px; font-weight: 700; cursor: pointer">
<sc-if value="{{it.iconQr}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{it.fg}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><path d="M14 14h3v3"></path><path d="M21 14v.01"></path><path d="M14 21h.01"></path><path d="M17 21h4v-4"></path></svg></sc-if>
<sc-if value="{{it.iconPulse}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{it.fg}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"></path></svg></sc-if>
<sc-if value="{{it.iconRefresh}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{it.fg}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 4v5h-5"></path></svg></sc-if>
<sc-if value="{{it.iconReset}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{it.fg}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"></path><path d="M4 4v5h5"></path></svg></sc-if>
{{it.text}}</button></sc-if>

<sc-if value="{{it.isNav}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{it.act}}" style="min-height: 80px; border-radius: 40px; border: none; background: #1A1B1F; box-sizing: border-box; padding: 10px 20px 10px 28px; display: flex; align-items: center; gap: 10px; color: #F2F4F6; font-family: 'Montserrat', sans-serif; cursor: pointer; text-align: left">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 21px; font-weight: 700; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{it.text}}</span><span style="font-size: 17px; font-weight: 600; color: #B1B8C2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.meta}}</span></span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B1B8C2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg></button></sc-if>

<sc-if value="{{it.isToggle}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{it.act}}" role="switch" aria-checked="{{it.on}}" style="min-height: 80px; border-radius: 40px; border: none; background: #1A1B1F; box-sizing: border-box; padding: 10px 16px 10px 28px; display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #F2F4F6; font-family: 'Montserrat', sans-serif; font-size: 21px; font-weight: 700; cursor: pointer; text-align: left">
<span style="line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{it.text}}</span>
<span aria-hidden="true" style="width: 60px; height: 36px; border-radius: 18px; background: {{it.track}}; position: relative; flex-shrink: 0; transition: background .25s ease"><span style="position: absolute; top: 5px; left: {{it.kx}}px; width: 26px; height: 26px; border-radius: 13px; background: {{it.knob}}; transition: left .25s cubic-bezier(.2,.8,.2,1), background .25s ease"></span></span>
</button></sc-if>

<sc-if value="{{it.isChoice}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{it.act}}" aria-pressed="{{it.sel}}" style="height: 76px; border-radius: 38px; border: 2px solid {{it.border}}; background: #1A1B1F; box-sizing: border-box; padding: 0 22px 0 {{it.pl}}px; display: flex; align-items: center; gap: 14px; color: #F2F4F6; font-family: 'Montserrat', sans-serif; cursor: pointer; text-align: left">
<sc-if value="{{it.hasAv}}" hint-placeholder-val="{{ false }}"><span style="width: 48px; height: 48px; border-radius: 50%; background: {{it.avBg}}; color: #F2F4F6; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; flex-shrink: 0">
<sc-if value="{{it.isAuto}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#001A05" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6L13 3z"></path></svg></sc-if>{{it.code}}</span></sc-if>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 21px; font-weight: 700; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{it.text}}</span><span style="font-size: 17px; font-weight: 600; color: #B1B8C2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.meta}}</span></span>
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3CE74F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; opacity: {{it.checkO}}"><path d="M5 12l5 5L20 7"></path></svg>
</button></sc-if>

<sc-if value="{{it.isQr}}" hint-placeholder-val="{{ false }}"><div style="display: flex; justify-content: center"><div style="width: {{it.qs}}px; height: {{it.qs}}px; border-radius: 26px; background: #FFFFFF; box-sizing: border-box; padding: 16px"><svg role="img" aria-label="QR-код: личный кабинет zeonvpn.com/manager" viewBox="0 0 29 29" width="100%" height="100%" shape-rendering="crispEdges" style="display: block"><path d="{{it.qrD}}" fill="#0B0C0E"></path></svg></div></div></sc-if>

<sc-if value="{{it.isNote}}" hint-placeholder-val="{{ false }}"><div style="padding: 0 14px; text-align: center; font-size: 19px; font-weight: 600; line-height: 1.3; color: #B1B8C2">{{it.text}}</div></sc-if>

<sc-if value="{{it.isStatus}}" hint-placeholder-val="{{ false }}"><div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 4px"><div style="display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 20px; font-weight: 700; color: {{it.c}}"><span class="{{it.pulse}}" style="width: 12px; height: 12px; border-radius: 6px; background: {{it.c}}"></span>{{it.text}}</div><div style="font-size: 17px; font-weight: 600; color: #8B939C">{{it.meta}}</div></div></sc-if>

<sc-if value="{{it.isInfo}}" hint-placeholder-val="{{ false }}"><div style="border-radius: 34px; background: #1A1B1F; box-sizing: border-box; padding: 16px 28px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 18px; font-weight: 600; color: #B1B8C2">{{it.text}}</span><span style="font-size: 24px; font-weight: 700; color: #F2F4F6; letter-spacing: .5px">{{it.meta}}</span></div></sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"$preview":{"width":376,"height":92}}'>
class Component extends DCLogic {
  renderVals() {
    const it = this.props.item || { kind: 'nav', isNav: true, text: 'Режим автовыбора', meta: 'Умный автовыбор', w: 376, h: 96, op: 1, pe: 'auto' };
    return { it };
  }
}
</script>
</body>
</html>
